<svg xmlns="http://www.w3.org/2000/svg" width="860" height="332" viewBox="0 0 860 332" role="img" aria-labelledby="wfTitle wfDesc">
  <title id="wfTitle">Engineering Workflow — How I Build and Ship Software</title>
  <desc id="wfDesc">Realistic iterative software development flowchart from problem framing and design through testing, debugging, and production feedback.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0816"/>
      <stop offset="50%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="hdrLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="30%" stop-color="#A855F7" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FB7185"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#A855F7"/>
    </marker>
  </defs>

  <!-- Seamless Dark Frame -->
  <rect width="860" height="332" rx="8" fill="#080808"/>
  <rect x="6" y="6" width="848" height="320" rx="6" fill="url(#bgGrad)" stroke="#7C3AED" stroke-width="1" stroke-opacity="0.38"/>

  <!-- Header Strip -->
  <text x="26" y="31" font-family="'Consolas', 'Courier New', monospace" font-size="11.5" font-weight="700" fill="#38BDF8" letter-spacing="1.8">[ ENGINEERING WORKFLOW · IDEA TO PRODUCTION ]</text>
  <text x="834" y="31" text-anchor="end" font-family="'Consolas', 'Courier New', monospace" font-size="10.5" fill="#A78BFA" letter-spacing="1.2">ITERATIVE BUILD &amp; DEBUG LOOP</text>
  <line x1="18" y1="42" x2="842" y2="42" stroke="url(#hdrLine)" stroke-width="1"/>

  <!-- NODE 1: FRAME PROBLEM -->
  <rect x="24" y="64" width="162" height="70" rx="5" fill="#0d0b1a" stroke="#7C3AED" stroke-width="1.2"/>
  <text x="36" y="83" font-family="'Consolas', 'Courier New', monospace" font-size="10" font-weight="700" fill="#A855F7">01 · ANALYZE</text>
  <text x="36" y="102" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">Frame Problem</text>
  <text x="36" y="120" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94A3B8">First-principles scope</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="186" y1="99" x2="208" y2="99" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arrowCyan)"/>

  <!-- NODE 2: DESIGN & BUILD -->
  <rect x="212" y="64" width="162" height="70" rx="5" fill="#0b1122" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="224" y="83" font-family="'Consolas', 'Courier New', monospace" font-size="10" font-weight="700" fill="#38BDF8">02 · ARCHITECT</text>
  <text x="224" y="102" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">Design &amp; Build</text>
  <text x="224" y="120" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94A3B8">Schema, UI &amp; REST logic</text>

  <!-- Arrow 2 -> Diamond -->
  <line x1="374" y1="99" x2="397" y2="99" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arrowCyan)"/>

  <!-- DECISION DIAMOND: TESTS & EDGE CASES PASS? -->
  <polygon points="484,56 568,99 484,142 400,99" fill="#091529" stroke="#38BDF8" stroke-width="1.4" filter="url(#glow)"/>
  <text x="484" y="95" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#E0F2FE">Edge Cases &amp;</text>
  <text x="484" y="111" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#38BDF8">Tests Pass?</text>

  <!-- YES PATH -> NODE 3 -->
  <line x1="568" y1="99" x2="658" y2="99" stroke="#10B981" stroke-width="1.6" marker-end="url(#arrowGreen)"/>
  <rect x="592" y="81" width="38" height="16" rx="3" fill="#064E3B" stroke="#10B981" stroke-width="0.9"/>
  <text x="611" y="93" text-anchor="middle" font-family="'Consolas', 'Courier New', monospace" font-size="10" font-weight="700" fill="#6EE7B7">YES</text>

  <!-- NODE 3: SHIP & MONITOR -->
  <rect x="662" y="64" width="174" height="70" rx="5" fill="#081b1a" stroke="#10B981" stroke-width="1.3"/>
  <text x="674" y="83" font-family="'Consolas', 'Courier New', monospace" font-size="10" font-weight="700" fill="#34D399">03 · DEPLOY</text>
  <text x="674" y="102" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">Ship &amp; Monitor</text>
  <text x="674" y="120" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#A7F3D0">Live build &amp; user metrics</text>

  <!-- NO PATH DOWN -> DEBUG NODE -->
  <line x1="484" y1="142" x2="484" y2="192" stroke="#FB7185" stroke-width="1.6" marker-end="url(#arrowRose)"/>
  <rect x="494" y="157" width="30" height="16" rx="3" fill="#4C0519" stroke="#FB7185" stroke-width="0.9"/>
  <text x="509" y="169" text-anchor="middle" font-family="'Consolas', 'Courier New', monospace" font-size="10" font-weight="700" fill="#FDA4AF">NO</text>

  <!-- DEBUG NODE: TRACE, DEBUG & REFACTOR -->
  <rect x="388" y="196" width="192" height="66" rx="5" fill="#180a1c" stroke="#FB7185" stroke-width="1.2"/>
  <text x="402" y="215" font-family="'Consolas', 'Courier New', monospace" font-size="10" font-weight="700" fill="#FB7185">DEBUG LOOP · FIX</text>
  <text x="402" y="233" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Trace &amp; Refactor</text>
  <text x="402" y="250" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#CBD5E1">Inspect logs &amp; patch root cause</text>

  <!-- RETURN ARROW: DEBUG -> BACK TO DESIGN & BUILD -->
  <path d="M 388 229 L 293 229 L 293 138" fill="none" stroke="#A855F7" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowPurple)"/>
  <rect x="208" y="169" width="76" height="16" rx="3" fill="#1e1035" stroke="#A855F7" stroke-width="0.8"/>
  <text x="246" y="180" text-anchor="middle" font-family="'Consolas', 'Courier New', monospace" font-size="9.5" font-weight="700" fill="#E9D5FF">RE-VERIFY</text>

  <!-- TELEMETRY ITERATION LOOP: SHIP -> FRAME PROBLEM -->
  <path d="M 749 134 L 749 294 L 105 294 L 105 138" fill="none" stroke="#7C3AED" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrowPurple)"/>
  <rect x="314" y="284" width="232" height="20" rx="4" fill="#110b22" stroke="#7C3AED" stroke-width="0.9"/>
  <text x="430" y="298" text-anchor="middle" font-family="'Consolas', 'Courier New', monospace" font-size="10" font-weight="700" fill="#C4B5FD">REAL-WORLD FEEDBACK &amp; NEXT ITERATION</text>
</svg>
