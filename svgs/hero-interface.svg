<svg xmlns="http://www.w3.org/2000/svg" width="860" height="196" viewBox="0 0 860 196" role="img" aria-labelledby="heroSysTitle heroSysDesc">
  <title id="heroSysTitle">System Interface — Shadow Developer (Pankaj Rana)</title>
  <desc id="heroSysDesc">Minimal Solo Leveling inspired System Interface showing Shadow Developer identity, class, rank, and directive.</desc>
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0816"/>
      <stop offset="50%" stop-color="#0d1020"/>
      <stop offset="100%" stop-color="#090712"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="topBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="30%" stop-color="#A855F7" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scanSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Seamless Outer Frame -->
  <rect width="860" height="196" rx="8" fill="#080808"/>

  <!-- Inner System Window -->
  <rect x="8" y="8" width="844" height="180" rx="6" fill="url(#panelBg)" stroke="url(#borderGrad)" stroke-width="1.2" stroke-opacity="0.55"/>

  <!-- Subtle Horizontal Scan Sweep -->
  <rect x="10" y="10" width="220" height="176" fill="url(#scanSweep)">
    <animate attributeName="x" values="-220;860" dur="5.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner HUD Brackets -->
  <path d="M 8 26 V 8 H 28" fill="none" stroke="#A855F7" stroke-width="2.5" filter="url(#softGlow)"/>
  <path d="M 832 8 H 852 V 26" fill="none" stroke="#38BDF8" stroke-width="2.5" filter="url(#softGlow)"/>
  <path d="M 8 170 V 188 H 28" fill="none" stroke="#38BDF8" stroke-width="2.5" filter="url(#softGlow)"/>
  <path d="M 832 188 H 852 V 170" fill="none" stroke="#A855F7" stroke-width="2.5" filter="url(#softGlow)"/>

  <!-- Top Header Strip -->
  <rect x="10" y="10" width="840" height="34" rx="4" fill="#130f26" fill-opacity="0.75"/>
  <circle cx="28" cy="27" r="4" fill="#10B981" filter="url(#softGlow)">
    <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="42" y="31" font-family="'Consolas', 'Courier New', monospace" font-size="11.5" font-weight="700" fill="#38BDF8" letter-spacing="2">[ SYSTEM INTERFACE // INITIALIZED ]</text>
  <text x="832" y="31" text-anchor="end" font-family="'Consolas', 'Courier New', monospace" font-size="11" fill="#A78BFA" letter-spacing="1.6">ID: PR-0536 // STATUS: LEVELING</text>
  <line x1="16" y1="44" x2="844" y2="44" stroke="url(#topBeam)" stroke-width="1"/>

  <!-- Left Panel: Identity & Rank -->
  <text x="32" y="75" font-family="'Consolas', 'Courier New', monospace" font-size="11" fill="#94A3B8" letter-spacing="1.8">IDENTITY</text>
  <text x="122" y="76" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif" font-size="21" font-weight="800" fill="#FFFFFF" letter-spacing="1.5" filter="url(#softGlow)">SHADOW DEVELOPER</text>

  <text x="32" y="105" font-family="'Consolas', 'Courier New', monospace" font-size="11" fill="#94A3B8" letter-spacing="1.8">HUNTER</text>
  <text x="122" y="105" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif" font-size="14.5"><tspan font-weight="600" fill="#E2E8F0">Pankaj Rana</tspan><tspan font-family="'Consolas', 'Courier New', monospace" font-size="11.5" fill="#A78BFA">  •  Full-Stack &amp; Applied AI</tspan></text>

  <text x="32" y="133" font-family="'Consolas', 'Courier New', monospace" font-size="11" fill="#94A3B8" letter-spacing="1.8">CLASS</text>
  <text x="122" y="133" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#C4B5FD">Developer / Builder / Explorer</text>

  <text x="32" y="161" font-family="'Consolas', 'Courier New', monospace" font-size="11" fill="#94A3B8" letter-spacing="1.8">RANK</text>
  <rect x="122" y="147" width="96" height="20" rx="4" fill="#7C3AED" fill-opacity="0.24" stroke="#A855F7" stroke-width="1"/>
  <text x="170" y="161" text-anchor="middle" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="700" fill="#E9D5FF" letter-spacing="1.2">DEVELOPER</text>
  <text x="228" y="161" font-family="'Consolas', 'Courier New', monospace" font-size="11" fill="#38BDF8" letter-spacing="0.8">// Evolving daily</text>

  <!-- Vertical Divider -->
  <line x1="482" y1="58" x2="482" y2="174" stroke="#7C3AED" stroke-width="1" stroke-dasharray="3 4" stroke-opacity="0.45"/>

  <!-- Right Panel: System Introduction Log -->
  <rect x="498" y="58" width="336" height="114" rx="5" fill="#070610" fill-opacity="0.85" stroke="#38BDF8" stroke-width="0.9" stroke-opacity="0.3"/>
  <rect x="498" y="58" width="3.5" height="114" rx="2" fill="#A855F7" filter="url(#softGlow)"/>

  <text x="514" y="79" font-family="'Consolas', 'Courier New', monospace" font-size="11" font-weight="700" fill="#A855F7" letter-spacing="1.8">[ SYSTEM INTRODUCTION ]</text>
  <text x="514" y="102" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif" font-size="12.5" fill="#CBD5E1">A developer navigating the software realm.</text>
  <text x="514" y="122" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif" font-size="12.5" fill="#CBD5E1">Every codebase is an uncharted dungeon,</text>
  <text x="514" y="142" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif" font-size="12.5" fill="#CBD5E1">every bug a trial, and every shipped build</text>
  <text x="514" y="161" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#38BDF8">permanent EXP gained. ARISE.</text>
</svg>
