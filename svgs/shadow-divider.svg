      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="25%" stop-color="#7C3AED" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#A855F7" stop-opacity="0.75"/>
