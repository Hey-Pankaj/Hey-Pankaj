<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="850" viewBox="0 0 680 850" role="img" aria-labelledby="sysTitle sysDesc">
  <title id="sysTitle">[ SYSTEM NOTIFICATION ] - PLAYER STATUS</title>
  <desc id="sysDesc">Solo Leveling System Status Holographic Window for Player Pankaj Rana</desc>
  <defs>
    <!-- Dark Void Radial Gradient -->
    <radialGradient id="voidBg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#041224" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#020814" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#02040a" stop-opacity="1"/>
    </radialGradient>

    <!-- Translucent Holographic Glass Background -->
    <linearGradient id="holoGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04142a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#020914" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Cyan Line Gradients -->
    <linearGradient id="cyanLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="xpBarGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0088ff"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <linearGradient id="scanBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="violetGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      text { font-family: 'Orbitron', 'Share Tech Mono', 'Rajdhani', -apple-system, sans-serif; }
      .mono { font-family: 'Share Tech Mono', 'Courier New', monospace; }
      .sans { font-family: 'Rajdhani', -apple-system, sans-serif; }
      .header-tag { font-size: 12px; fill: #00f0ff; letter-spacing: 4px; }
      .header-title { font-size: 26px; font-weight: 800; fill: #ffffff; letter-spacing: 5px; }
      .label { font-size: 12px; fill: #6393b4; letter-spacing: 2px; }
      .sep { font-size: 13px; fill: #00f0ff; }
      .val-text { font-size: 18px; font-weight: 700; fill: #ffffff; letter-spacing: 1.5px; }
      .val-class { font-size: 15px; font-weight: 800; fill: #c084fc; letter-spacing: 2px; }
      .val-cyan { font-size: 15px; font-weight: 800; fill: #00f0ff; letter-spacing: 2px; }
      .attr-title { font-size: 12px; font-weight: 700; fill: #00f0ff; letter-spacing: 2.5px; }
      .attr-lbl { font-size: 13px; fill: #6393b4; letter-spacing: 2px; }
      .attr-num { font-size: 15px; font-weight: 700; fill: #00f0ff; }
      .xp-lbl { font-size: 12px; font-weight: 700; fill: #00f0ff; letter-spacing: 2.5px; }
      .xp-pct { font-size: 12px; fill: #6393b4; letter-spacing: 1px; }
      .xp-foot { font-size: 11px; fill: #6393b4; letter-spacing: 1.5px; }
      .msg-tag { font-size: 11px; fill: #00f0ff; letter-spacing: 2px; font-weight: 700; }
      .msg-title { font-size: 14px; font-weight: 800; fill: #ffffff; letter-spacing: 2.5px; }
      .msg-body { font-size: 12px; fill: #6393b4; letter-spacing: 1.8px; }
      .msg-dir { font-size: 12px; font-weight: 800; fill: #c084fc; letter-spacing: 3px; }
      .cross { font-size: 13px; fill: #00f0ff; opacity: 0.7; }
    </style>
  </defs>

  <!-- Deep Void Background -->
  <rect width="680" height="850" fill="url(#voidBg)"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="340" cy="425" r="280" fill="#0088ff" opacity="0.06"/>

  <!-- THE SYSTEM WINDOW -->
  <g id="systemWindow">
    <!-- Window Outer Glass -->
    <rect x="40" y="30" width="600" height="780" rx="3" fill="url(#holoGlass)" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.45"/>
    <rect x="42" y="32" width="596" height="776" rx="2" fill="none" stroke="#0088ff" stroke-width="0.8" stroke-opacity="0.25"/>

    <!-- Animated Holographic Scanline -->
    <g opacity="0.72">
      <rect x="42" y="32" width="596" height="72" fill="url(#scanBeam)">
        <animate attributeName="y" values="30;736;30" dur="3.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="42" y="66" width="596" height="2" fill="#00f0ff" opacity="0.45" filter="url(#cyanGlow)">
        <animate attributeName="y" values="64;770;64" dur="3.8s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Corner Brackets -->
    <g filter="url(#cyanGlow)">
      <path d="M 38 52 V 28 H 62" fill="none" stroke="#00f0ff" stroke-width="2.5"/>
      <path d="M 618 28 H 642 V 52" fill="none" stroke="#00f0ff" stroke-width="2.5"/>
      <path d="M 38 788 V 812 H 62" fill="none" stroke="#00f0ff" stroke-width="2.5"/>
      <path d="M 618 812 H 642 V 788" fill="none" stroke="#00f0ff" stroke-width="2.5"/>
      <animate attributeName="opacity" values="0.55;1;0.55" dur="2.4s" repeatCount="indefinite"/>
    </g>

    <!-- Corner Reticle Crosses -->
    <text x="52" y="47" class="cross mono">+</text>
    <text x="622" y="47" class="cross mono" text-anchor="end">+</text>
    <text x="52" y="799" class="cross mono">+</text>
    <text x="622" y="799" class="cross mono" text-anchor="end">+</text>

    <!-- A. SYSTEM HEADER -->
    <text x="340" y="74" text-anchor="middle" class="header-tag mono" filter="url(#cyanGlow)">[ SYSTEM NOTIFICATION ]</text>
    <text x="340" y="112" text-anchor="middle" class="header-title" filter="url(#cyanGlow)">PLAYER STATUS</text>
    <line x1="120" y1="130" x2="560" y2="130" stroke="url(#cyanLine)" stroke-width="1.2"/>
    <rect x="320" y="128.5" width="40" height="3" fill="#00f0ff" filter="url(#cyanGlow)"/>

    <!-- B. PLAYER IDENTIFICATION -->
    <!-- Row 1: Name -->
    <text x="70" y="168" class="label mono">PLAYER NAME</text>
    <text x="215" y="168" class="sep mono">:</text>
    <text x="235" y="169" class="val-text sans">Pankaj Rana</text>

    <!-- Row 2: Class -->
    <text x="70" y="202" class="label mono">PLAYER CLASS</text>
    <text x="215" y="202" class="sep mono">:</text>
    <text x="235" y="202" class="val-class" filter="url(#violetGlow)">SHADOW MONARCH</text>

    <!-- Row 3: Rank -->
    <text x="70" y="236" class="label mono">HUNTER RANK</text>
    <text x="215" y="236" class="sep mono">:</text>
    <text x="235" y="236" class="val-cyan" filter="url(#cyanGlow)">EVOLVING</text>

    <!-- Row 4: Level -->
    <text x="70" y="270" class="label mono">PLAYER LEVEL</text>
    <text x="215" y="270" class="sep mono">:</text>
    <text x="235" y="270" class="val-cyan mono">IN PROGRESS</text>

    <line x1="70" y1="292" x2="610" y2="292" stroke="#00f0ff" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.3"/>

    <!-- C. STATUS ATTRIBUTES -->
    <text x="70" y="324" class="attr-title mono">[ PLAYER ATTRIBUTES ]</text>

    <!-- Attribute: Strength -->
    <text x="70" y="358" class="attr-lbl mono">STRENGTH</text>
    <line x1="175" y1="354" x2="480" y2="354" stroke="#00f0ff" stroke-width="1" stroke-dasharray="2 5" stroke-opacity="0.3"/>
    <text x="500" y="358" class="attr-num mono" text-anchor="end">—</text>
    <!-- Mini Meter Track -->
    <rect x="525" y="348" width="85" height="6" fill="#142c44" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.4"/>
    <rect x="527" y="350" width="35" height="2" fill="#00f0ff" opacity="0.9">
      <animate attributeName="width" values="28;52;28" dur="2.8s" begin="0s" repeatCount="indefinite"/>
    </rect>

    <!-- Attribute: Agility -->
    <text x="70" y="392" class="attr-lbl mono">AGILITY</text>
    <line x1="175" y1="388" x2="480" y2="388" stroke="#00f0ff" stroke-width="1" stroke-dasharray="2 5" stroke-opacity="0.3"/>
    <text x="500" y="392" class="attr-num mono" text-anchor="end">—</text>
    <rect x="525" y="382" width="85" height="6" fill="#142c44" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.4"/>
    <rect x="527" y="384" width="35" height="2" fill="#00f0ff" opacity="0.9">
      <animate attributeName="width" values="28;56;28" dur="2.8s" begin="0.35s" repeatCount="indefinite"/>
    </rect>

    <!-- Attribute: Stamina -->
    <text x="70" y="426" class="attr-lbl mono">STAMINA</text>
    <line x1="175" y1="422" x2="480" y2="422" stroke="#00f0ff" stroke-width="1" stroke-dasharray="2 5" stroke-opacity="0.3"/>
    <text x="500" y="426" class="attr-num mono" text-anchor="end">—</text>
    <rect x="525" y="416" width="85" height="6" fill="#142c44" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.4"/>
    <rect x="527" y="418" width="35" height="2" fill="#00f0ff" opacity="0.9">
      <animate attributeName="width" values="28;48;28" dur="2.8s" begin="0.7s" repeatCount="indefinite"/>
    </rect>

    <!-- Attribute: Intelligence -->
    <text x="70" y="460" class="attr-lbl mono">INTELLIGENCE</text>
    <line x1="175" y1="456" x2="480" y2="456" stroke="#00f0ff" stroke-width="1" stroke-dasharray="2 5" stroke-opacity="0.3"/>
    <text x="500" y="460" class="attr-num mono" text-anchor="end">—</text>
    <rect x="525" y="450" width="85" height="6" fill="#142c44" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.4"/>
    <rect x="527" y="452" width="35" height="2" fill="#00f0ff" opacity="0.9">
      <animate attributeName="width" values="28;62;28" dur="2.8s" begin="1.05s" repeatCount="indefinite"/>
    </rect>

    <!-- Attribute: Sense -->
    <text x="70" y="494" class="attr-lbl mono">SENSE</text>
    <line x1="175" y1="490" x2="480" y2="490" stroke="#00f0ff" stroke-width="1" stroke-dasharray="2 5" stroke-opacity="0.3"/>
    <text x="500" y="494" class="attr-num mono" text-anchor="end">—</text>
    <rect x="525" y="484" width="85" height="6" fill="#142c44" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.4"/>
    <rect x="527" y="486" width="35" height="2" fill="#00f0ff" opacity="0.9">
      <animate attributeName="width" values="28;50;28" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
    </rect>

    <!-- D. EXPERIENCE SECTION -->
    <rect x="70" y="525" width="540" height="92" fill="#020a16" fill-opacity="0.75" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.35"/>
    <text x="90" y="552" class="xp-lbl mono" filter="url(#cyanGlow)">EXPERIENCE</text>
    <text x="590" y="552" class="xp-pct mono" text-anchor="end">35%</text>

    <!-- XP Bar Track -->
    <rect x="90" y="563" width="500" height="8" fill="#0a2036" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.4"/>
    <rect x="91" y="564" width="175" height="6" fill="url(#xpBarGrad)">
      <animate attributeName="opacity" values="0.65;1;0.65" dur="2s" repeatCount="indefinite"/>
    </rect>

    <text x="90" y="598" class="xp-foot mono">NEXT LEVEL</text>
    <text x="180" y="598" class="xp-foot mono" fill="#ffffff">: IN PROGRESS</text>

    <!-- E. SYSTEM NOTIFICATION PANEL -->
    <rect x="70" y="635" width="540" height="120" fill="#040e1e" fill-opacity="0.9" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.35"/>
    <!-- Left Accent Bar -->
    <rect x="70" y="635" width="4" height="120" fill="#00f0ff" filter="url(#cyanGlow)"/>

    <text x="90" y="662" class="msg-tag mono" filter="url(#cyanGlow)">[ SYSTEM MESSAGE ]
      <animate attributeName="opacity" values="0.75;1;0.75" dur="2s" repeatCount="indefinite"/>
    </text>
    <text x="90" y="688" class="msg-title">WELCOME, PLAYER.</text>
    <text x="90" y="711" class="msg-body mono">YOUR JOURNEY HAS BEGUN.</text>
    <line x1="90" y1="724" x2="590" y2="724" stroke="#c084fc" stroke-width="0.8" stroke-dasharray="3 3" stroke-opacity="0.35"/>
    <text x="590" y="744" class="msg-dir mono" text-anchor="end" filter="url(#violetGlow)">[ SYSTEM DIRECTIVE: ARISE. ]</text>
  </g>

  <!-- System Sub-tag -->
  <text x="340" y="834" text-anchor="middle" font-family="'Share Tech Mono', monospace" font-size="10" fill="#6393b4" opacity="0.6" letter-spacing="2">THE SYSTEM · MONARCH INTERFACE</text>
</svg>