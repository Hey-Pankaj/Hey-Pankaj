<svg xmlns="http://www.w3.org/2000/svg" width="860" height="258" viewBox="0 0 860 258" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">System Architecture Flows — Full-Stack and Computer Vision Pipelines</title>
  <desc id="archDesc">Realistic data flow diagrams for Pankaj Rana's full-stack web apps (SANAIRO, ParkBay) and computer vision systems (SAMS, ParkBay Vision).</desc>
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0816"/>
      <stop offset="50%" stop-color="#080c17"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="sepLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0"/>
      <stop offset="30%" stop-color="#A855F7" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <marker id="arrV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#A855F7"/>
    </marker>
    <marker id="arrC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
  </defs>

  <rect width="860" height="258" rx="8" fill="#080808"/>
  <rect x="6" y="6" width="848" height="246" rx="6" fill="url(#archBg)" stroke="#38BDF8" stroke-width="0.9" stroke-opacity="0.32"/>

  <!-- Header -->
  <text x="24" y="29" font-family="'Consolas', 'Courier New', monospace" font-size="11.5" font-weight="700" fill="#A855F7" letter-spacing="1.8">[ SYSTEM ARCHITECTURES · AS-BUILT DATA FLOWS ]</text>
  <text x="836" y="29" text-anchor="end" font-family="'Consolas', 'Courier New', monospace" font-size="10.5" fill="#64748B" letter-spacing="1">VERIFIED PROJECT STACKS</text>
  <line x1="18" y1="39" x2="842" y2="39" stroke="url(#sepLine)" stroke-width="1"/>

  <!-- TRACK A: FULL-STACK WEB FLOW -->
  <text x="24" y="60" font-family="'Consolas', 'Courier New', monospace" font-size="10.5" font-weight="700" fill="#C4B5FD" letter-spacing="1.2">TRACK A · FULL-STACK REQUEST PIPELINE (SANAIRO &amp; PARKBAY)</text>

  <rect x="24" y="70" width="174" height="58" rx="4" fill="#110d24" stroke="#7C3AED" stroke-width="1.1"/>
  <text x="36" y="92" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Client Interface</text>
  <text x="36" y="112" font-family="'Consolas', 'Courier New', monospace" font-size="10.5" fill="#A78BFA">React / Next.js UI</text>

  <line x1="198" y1="99" x2="225" y2="99" stroke="#A855F7" stroke-width="1.5" marker-end="url(#arrV)"/>

  <rect x="228" y="70" width="174" height="58" rx="4" fill="#110d24" stroke="#7C3AED" stroke-width="1.1"/>
  <text x="240" y="92" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">API &amp; Validation</text>
  <text x="240" y="112" font-family="'Consolas', 'Courier New', monospace" font-size="10.5" fill="#A78BFA">Node.js REST Endpoints</text>

  <line x1="402" y1="99" x2="429" y2="99" stroke="#A855F7" stroke-width="1.5" marker-end="url(#arrV)"/>

  <rect x="432" y="70" width="174" height="58" rx="4" fill="#110d24" stroke="#7C3AED" stroke-width="1.1"/>
  <text x="444" y="92" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Data Persistence</text>
  <text x="444" y="112" font-family="'Consolas', 'Courier New', monospace" font-size="10.5" fill="#A78BFA">MongoDB / MySQL Schema</text>

  <line x1="606" y1="99" x2="633" y2="99" stroke="#A855F7" stroke-width="1.5" marker-end="url(#arrV)"/>

  <rect x="636" y="70" width="200" height="58" rx="4" fill="#15102d" stroke="#A855F7" stroke-width="1.2"/>
  <text x="648" y="92" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">State Synchronization</text>
  <text x="648" y="112" font-family="'Consolas', 'Courier New', monospace" font-size="10.5" fill="#E9D5FF">Habit Feed &amp; Slot Booking</text>

  <!-- Subtle Horizontal Divider -->
  <line x1="24" y1="146" x2="836" y2="146" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- TRACK B: COMPUTER VISION PIPELINE -->
  <text x="24" y="166" font-family="'Consolas', 'Courier New', monospace" font-size="10.5" font-weight="700" fill="#7DD3FC" letter-spacing="1.2">TRACK B · COMPUTER VISION PIPELINE (SAMS &amp; PARKBAY VISION)</text>

  <rect x="24" y="176" width="174" height="58" rx="4" fill="#071324" stroke="#0284C7" stroke-width="1.1"/>
  <text x="36" y="198" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Video Ingestion</text>
  <text x="36" y="218" font-family="'Consolas', 'Courier New', monospace" font-size="10.5" fill="#7DD3FC">Webcam / Overhead Feed</text>

  <line x1="198" y1="205" x2="225" y2="205" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arrC)"/>

  <rect x="228" y="176" width="174" height="58" rx="4" fill="#071324" stroke="#0284C7" stroke-width="1.1"/>
  <text x="240" y="198" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Frame Processing</text>
  <text x="240" y="218" font-family="'Consolas', 'Courier New', monospace" font-size="10.5" fill="#7DD3FC">OpenCV Crop &amp; Normalize</text>

  <line x1="402" y1="205" x2="429" y2="205" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arrC)"/>

  <rect x="432" y="176" width="174" height="58" rx="4" fill="#071324" stroke="#0284C7" stroke-width="1.1"/>
  <text x="444" y="198" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Feature &amp; Match</text>
  <text x="444" y="218" font-family="'Consolas', 'Courier New', monospace" font-size="10.5" fill="#7DD3FC">DeepFace / Bay Bounds</text>

  <line x1="606" y1="205" x2="633" y2="205" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arrC)"/>

  <rect x="636" y="176" width="200" height="58" rx="4" fill="#081a30" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="648" y="198" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Verified Output</text>
  <text x="648" y="218" font-family="'Consolas', 'Courier New', monospace" font-size="10.5" fill="#BAE6FD">Attendance Log / Bay Matrix</text>
</svg>

