      <stop offset="30%" stop-color="#00D4FF" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#7C3AED" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <filter id="regGlow" x="-20%" y="-20%" width="140%" height="140%">
