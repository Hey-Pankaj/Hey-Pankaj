<svg xmlns="http://www.w3.org/2000/svg" width="860" height="404" viewBox="0 0 860 404" role="img" aria-labelledby="questTitle questDesc">
  <title id="questTitle">System Notification — The Active Quest</title>
  <desc id="questDesc">Solo Leveling Notification Window displaying Pankaj Rana's active developer quests and engineering priorities.</desc>
  <defs>
    <radialGradient id="questBgGlow" cx="50%" cy="52%" r="58%">
      <stop offset="0%" stop-color="#051a38" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#040c1c" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#080808" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="winGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05142b" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#030917" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="cyanEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4FF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="neonCyan" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Seamless Dark Void Base -->
  <rect width="860" height="404" rx="8" fill="#080808"/>
  <rect width="860" height="404" rx="8" fill="url(#questBgGlow)"/>

  <!-- Subtle Floating Ambient Embers -->
  <circle cx="88" cy="120" r="1.5" fill="#38BDF8" opacity="0.55"/>
  <circle cx="775" cy="95" r="2" fill="#00D4FF" opacity="0.45"/>
  <circle cx="64" cy="295" r="1.8" fill="#7C3AED" opacity="0.55"/>
  <circle cx="792" cy="318" r="1.6" fill="#38BDF8" opacity="0.6"/>
  <circle cx="140" cy="368" r="1.4" fill="#00D4FF" opacity="0.4"/>
  <circle cx="715" cy="362" r="1.5" fill="#A855F7" opacity="0.45"/>

  <!-- Outer Wireframe Notification Box -->
  <rect x="46" y="34" width="768" height="346" rx="3" fill="url(#winGlass)" stroke="#00B4FF" stroke-width="1.6" stroke-opacity="0.75" filter="url(#neonCyan)"/>
  <rect x="54" y="42" width="752" height="330" rx="2" fill="none" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.32"/>

  <!-- Top Center Diamond Crown Sigil -->
  <path d="M 392 22 L 414 32 M 468 22 L 446 32" stroke="#00D4FF" stroke-width="1.6" stroke-linecap="round" filter="url(#neonCyan)"/>
  <polygon points="430,8 443,24 430,40 417,24" fill="#041226" stroke="#38BDF8" stroke-width="1.8" filter="url(#neonCyan)"/>
  <polygon points="430,14 437,24 430,34 423,24" fill="#E0F7FF"/>

  <!-- Corner Brackets -->
  <path d="M 42 58 V 30 H 72" fill="none" stroke="#00E5FF" stroke-width="2.5" filter="url(#neonCyan)"/>
  <path d="M 788 30 H 818 V 58" fill="none" stroke="#00E5FF" stroke-width="2.5" filter="url(#neonCyan)"/>
  <path d="M 42 356 V 384 H 72" fill="none" stroke="#00E5FF" stroke-width="2.5" filter="url(#neonCyan)"/>
  <path d="M 788 384 H 818 V 356" fill="none" stroke="#00E5FF" stroke-width="2.5" filter="url(#neonCyan)"/>

  <!-- NOTIFICATION HEADER ROW -->
  <!-- Exclamation Circle -->
  <circle cx="192" cy="84" r="20" fill="#031024" stroke="#00D4FF" stroke-width="2" filter="url(#neonCyan)"/>
  <circle cx="192" cy="84" r="15.5" fill="none" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="192" y="92" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#E0F7FF" filter="url(#textGlow)">!</text>

  <!-- NOTIFICATION Title Frame -->
  <rect x="224" y="64" width="466" height="40" rx="2" fill="#020b18" fill-opacity="0.85" stroke="#00D4FF" stroke-width="1.4" stroke-opacity="0.85"/>
  <rect x="228" y="68" width="458" height="32" rx="1" fill="none" stroke="#38BDF8" stroke-width="0.6" stroke-opacity="0.35"/>
  <text x="457" y="92" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#E0F7FF" letter-spacing="7" filter="url(#textGlow)">NOTIFICATION</text>

  <!-- QUEST TITLE SECTION -->
  <text x="430" y="136" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#BAE6FD" letter-spacing="1">[The Active Quest:]</text>
  <text x="430" y="170" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" font-style="italic" fill="#FFFFFF" letter-spacing="0.8" filter="url(#textGlow)">&#8220;Path of the Shadow Developer.&#8221;</text>

  <!-- QUEST OBJECTIVES PANEL -->
  <rect x="92" y="190" width="676" height="118" rx="4" fill="#020814" fill-opacity="0.78" stroke="#00B4FF" stroke-width="0.9" stroke-opacity="0.35"/>

  <!-- Objective 1 -->
  <text x="114" y="216" font-family="'Consolas', 'Courier New', monospace" font-size="12" font-weight="700" fill="#38BDF8">[&#10003;] MAIN QUEST</text>
  <text x="278" y="216" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif" font-size="12.5" fill="#E2E8F0">Scaling SANAIRO — habit analytics &amp; mindful web (sanairo.com)</text>

  <!-- Objective 2 -->
  <text x="114" y="242" font-family="'Consolas', 'Courier New', monospace" font-size="12" font-weight="700" fill="#38BDF8">[&#10003;] DAILY DUNGEON</text>
  <text x="278" y="242" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif" font-size="12.5" fill="#E2E8F0">Algorithmic Rigor — DSA mastery in C++ &amp; Python (DSA-CODES)</text>

  <!-- Objective 3 -->
  <text x="114" y="268" font-family="'Consolas', 'Courier New', monospace" font-size="12" font-weight="700" fill="#38BDF8">[&#10003;] SKILL AWAKENING</text>
  <text x="278" y="268" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif" font-size="12.5" fill="#E2E8F0">Applied Vision &amp; AI — face recognition &amp; edge pipelines (sams-PL)</text>

  <!-- Objective 4 -->
  <text x="114" y="294" font-family="'Consolas', 'Courier New', monospace" font-size="12" font-weight="700" fill="#A855F7">[&#8226;] BOSS RAID</text>
  <text x="278" y="294" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif" font-size="12.5" fill="#CBD5E1">Full-Stack Systems — Next.js, database indexing &amp; resilient APIs</text>

  <!-- BOTTOM ACCEPT / CONFIRMATION CHECKMARK BUTTON -->
  <rect x="355" y="322" width="150" height="36" rx="2" fill="#031226" fill-opacity="0.9" stroke="#00D4FF" stroke-width="1.4" filter="url(#neonCyan)"/>
  <rect x="360" y="327" width="140" height="26" rx="1" fill="none" stroke="#38BDF8" stroke-width="0.7" stroke-opacity="0.45"/>
  <path d="M 420 340 L 427 347 L 441 333" fill="none" stroke="#38BDF8" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#textGlow)"/>
</svg>

